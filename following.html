<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, user-scalable= no"
    http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <title>friends-following</title>
  <style>
  body{
    margin: 30px 0px 0px 0px;
  }
  </style>
</head>
<body>
  <div style="position: fixed; top: 0; left: 0; width: 100%; border-bottom: 1px solid whitesmoke; background-color: white;">
    <table style="width: 100%;">
      <td onclick="history.back()" style="width: 10%;">
        <div style="background-image: url('icon/backarrow.png'); background-size: cover; background-position: center; width: 22px; height: 22px;"></div>
      </td>
      <td>
        <div style="text-align: left;">Wizzy followering</div>
      </td>
    </table>
     </div>
  
  <table style="width: 100%;">
    <tr>
    <td  style="width: 18%;">
      <div style="width: 50px; height: 50px; border-radius: 100px; border: 1px solid whitesmoke;">
      <div style="background-image: url('image/image1.jpg'); background-size: cover; background-position: center; width: 100%; height: 100%; border-radius: 100px;"></div>
      </div>
      </td>
      <td>
     <div style="font-size: 18px; font-weight: bold;">
       Spend_ing</div>
     <div style="font-size: 15px; font-weight: normal; padding: 3px 0px;">
       10 following</div> 
    </td>
      <td style="width: 25%;">
    <button id="followers"
      onclick="
      document.getElementById('followers').style.display = 'none';
      document.getElementById('following').style.display = 'block';"
      style="width: 70px; text-shadow: 0px 1px 1px white; padding: 3px 4px 3px 4px; font-size: 16px; border: none; border-radius: 5px; background-color: purple; color: white;">
    Follow</button>
        
   <button id="following"
     onclick="
      document.getElementById('followers').style.display = 'block';
      document.getElementById('following').style.display = 'none';"
     style="display: none; text-shadow: 0px 1px 1px white; padding: 3px 6px 3px 6px; font-size: 16px; border: none; border-radius: 5px; background-color: purple; color: white;">
      Following</button>
      </td>
    </tr>
  </table>
  

</body>
</html>
