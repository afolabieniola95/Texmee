<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create Account - TexMee</title>
  <link rel="stylesheet" href="create-account.css">
</head>
<body>
  <div class="container">
  
    <form action="sign_up.php" method="POST" enctype="multipart/form-data" id="accountForm">

      <!-- Step 1 -->
      <div class="form-step active" id="step1">

        <div style="display: flex; align-items: center;  gap: 40px; text-align: center;">
      <img onclick="history.back()"  src="icon/backarrow.png" style="width: 20px; height: 20px;">
       <h3>What's your name?</h3>
</div>

        <label>First Name</label>
        <div class="input-wrapper">
        <input type="text" id="firstName" name="first_name" autocapitalize="words" required>
         <span class="error-text"></span>
         </div>
         
        <label>Last Name</label>
      <div class="input-wrapper">
        <input type="text" id="lastName" name="last_name" autocapitalize="words" required>
        <span class="error-text"></span>
        </div>
        
        <div class="btn-group">
        <button type="button" class="next-btn">Next</button>
        </div>
</div>

        <!-- Step 2-->
     <div class="form-step" id="step2">

         <div style="display: flex; align-items: center;  gap: 40px; text-align: center;">
      <img class="back-btn"  src="icon/backarrow.png" style="width: 20px; height: 20px;">
       <h3>What's your date of birth?</h3>
</div>

       <label>Date of Birth</label>
       <div class="input-wrapper">
        <input type="date" name="dob" id="dob" placeholder="Date of birth">
         <span class="error-text"></span>
         </div>
         
        <div class="btn-group">
          <button type="button" class="next-btn">Next</button>
        </div>
</div>

     <!-- Step 3-->
     <div class="form-step" id="step3">

         <div style="display: flex; align-items: center;  gap: 40px; text-align: center;">
      <img class="back-btn"  src="icon/backarrow.png">
        <h3>What's your gender?</h3>
</div>

       <label>Gender</label>
       <div class="input-wrapper">
        <select id="gender" name="gender">
          <option value="">Select Gender</option>
          <option>Male</option>
          <option>Female</option>
          <option>Other</option>
        </select>
        <span class="error-text"></span>
        </div>
        
        <div class="btn-group">
          <button type="button" class="next-btn">Next</button>
        </div>
</div>

      <!-- Step 4 -->
      <div class="form-step" id="step4">

  <div style="display: flex; align-items: center;  gap: 20px; text-align: center;">
      <img class="back-btn"  src="icon/backarrow.png">   
      <h3>What's your mobile number and email?</h3>
</div>

        <label>Email</label>
        <div class="input-wrapper">
        <input type="email" id="email" name="email" required>
         <span class="error-text"></span>
         
        <label>Phone Number</label>
        <div class="input-wrapper">
        <input type="tel" id="phone" name="phone" required>
        <span class="error-text"></span>
        </div>
        
        <div class="btn-group">
          <button type="button" class="next-btn">Next</button>
        </div>
      </div>

      <!-- Step 5 -->
      <div class="form-step" id="step5">

    <div style="display: flex; align-items: center;  gap: 40px; text-align: center;">
      <img class="back-btn"  src="icon/backarrow.png">
      <h3>Create Password</h3>
</div>

        <label>Password</label>
       <div class="input-wrapper">
        <input type="password" id="password" name="password" required>
         <span class="error-text"></span>
         </div>
         
     <div class="toggle" onclick="togglePassword()">Show</div>
      
       
        <div class="btn-group">
          <button type="button" class="next-btn">Next</button>
        </div>
    </div>

        <!-- Step 6 -->
      <div class="form-step" id="step6">

       <div style="display: flex; align-items: center;  gap: 40px; text-align: center;">
      <img class="back-btn"  src="icon/backarrow.png">
      <h3>Profile Photo</h3>
</div>

        <label>
         <div style="display: flex; align-items: center; justify-content: center;">
        <img id="profilePreview" class="preview">
         <input type="file" id="profilePic" name="profile_pic" accept="image/*" style="display: none;">
         </div>
        </label>

        <div class="btn-group">
          <button type="button" class="submit-btn">Create Account</button>
        </div>

      </div>
    </form>
  </div>

  <script src="create-account.js" defer></script>
</body>
</html>
