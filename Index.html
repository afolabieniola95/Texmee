
<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
			padding: 10px;
            align-items: center;
			justify-content: center;
        }

        input{
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%; 
            padding: 11px;
            font-size: 13px; 
            border-radius: 5px; 
            border: 1.5px solid gray;
            outline: none;
            box-sizing: border-box;
		      	background-color: whitesmoke;
        }

    .password-wrapper {
            display: flex;
            align-items: center;
            margin-top: 30px; 
            width: 400px;   
            padding: 5px;
            height: 40px;
            font-size: 14px; 
            border-radius: 5px; 
            border: 1.5px solid gray;
            outline: none;
            box-sizing: border-box;
		    background-color: whitesmoke;
        }   
        

 button {
    width: 150px;
    background-color: black;
    color: white;
    padding: 5px;
    box-shadow: 1px 2px 1px 1px black;
    border-radius: 5px;
    font-weight: bold;
    cursor: pointer;
    margin: 50px 50px;
}

 .error {
 color: red;
 font-size: 12px;
 margin-bottom: 10px;
 display: block;
}     
		
	.toggle {
      cursor: pointer;
      font-size: 11px;
      color: grey;
      user-select: none;
	   text-align: right;
    }

    #container  {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    max-width: 1200px;
    margin: 0 auto;
    width: 100%;
    background-color: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    box-sizing: border-box;
  }

  @keyframes shake {
    0% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    50% { transform: translateX(5px); }
    75% { transform: translateX(-5px); }
    100% { transform: translateX(0); }
  }
  
  .error-text {
   display: block;
   font-size: 12px;
   font-family: Arial,sans-serif,Trebuchet MS;
   color: #f10f;
   height: 16px;
   padding: 05px;
   margin-top: 2px;
 }
 

  .input-error {
  border: 2px double  red;
  box-shadow: 1px 1px 2px red;
  animation: shake 0.3s;
 }

  .spinner {
  border: 3px solid #f3f3f3; /* Light grey */
  border-top: 3px solid black; /* Black */
  border-radius: 50%;
  width: 14px;
  height: 14px;
  animation: spin 1s linear infinite;
  display: inline-block;
  vertical-align: middle;
  margin-right: 8px;
  }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  .modal{
    display: none;
    align-items: center;
    justify-content: center;
    position: fixed;
    bottom: 0;
    left: 50%;
    width: 0%;
    height: 0px;
    text-align: center;
    border: 1px solid grey;
    border-radius: 9px;
    box-shadow: 0 5px 5px grey, 0 0 5px grey;
    background-color: whitesmoke;
    font-size: 16px;
    font-family: Arial, Helvetica, sans-serif, segoe UI;
    transition: 0.5s ease;
    transform: translate(-50%, 0);
  }

  p{
    white-space: nowrap;
    font-size: 13px;
     font-family: Arial, Helvetica, sans-serif, segoe UI;
     text-align: center;
  }
    </style>
</head>
<body>

    <div id="container">
    
    <div style = "padding: 10px; display: flex; align-items: center; justify-content: center;">
      <img src = "icon/texmee-logo.png" style = "width: 70px; height: 70px;">
      <div style = "padding: 15px 0px; font-size: 20px; color: black; font-weight: bold; text-align: left;">TexMee</div>

    </div>



     <form id="loginForm">

         <div class = "input-wrapper">
        <input type="email" name="email" id="emailInput"  placeholder = "Email or phone"> 
          <span class="error-text"></span>
</div>
       
        <div class = "input-wrapper">
        <div class = "password-wrapper">
        <input type="password" name="password" id="passwordInput" placeholder = "Password"  style="border: none; outline: none; background-color: transparent;
        margin: 0px; height: 30px;">
		<div class="toggle" onclick="togglePassword()">
         <img src="icon/password-open.png" style="width: 15px; height: 15px;">
        </div>
    </div>

        <span class="error-text"></span> 
     </div>
       
        
       <a href = "forgotten-password.html" style = " margin-top: 30px;  text-decoration: none; color: black;">
      <div style="text-align: center; font-size: 14px;">Forgotten password?</div>
       </a> 

       <center>
            <button type="submit" class="login-btn">Login</button>
        </center>

       
  
    <p>Don't have an account yet?
      <span><a href="create_account.html" style="text-decoration: none; color: purple">Sign up</a></span>
      </p>
	
	<div style = "align-items: center; justify-content: center; display: flex; gap: 20px; padding-top: 16px;">
	  <div style = "border-bottom: 1px solid grey; width: 100px; margin: 10px;"></div>  
	 <div style = "font-size: 15px;">Or continue with</div>
	 <div style = "border-bottom: 1px solid grey; width: 100px; margin: 10px;"></div>
  </div>
     
   <div style = "display: flex; align-items: center; justify-content: center; gap: 90px;  padding: 30px;">
	
   <img src ="icon/chrome.png" style = "background-color: white; width: 40px; height: 40px;">
   <img src ="icon/facebook.jpeg" style = "width: 30px; height: 33px;">
	</div>

</form>
</div>

<div id="message-alert" class="modal">
  <p id="modal-message"></p>
</div>

  <script>
   
const form = document.getElementById('loginForm');

form.addEventListener('submit', function(event) {

event.preventDefault();

  const emailInput = document.getElementById('emailInput');
  const passwordInput = document.getElementById('passwordInput');
  const passwordWrapper = passwordInput.closest('.password-wrapper');

  let hasError = false;

  if (!emailInput.value.trim()) {
    shakeInput(emailInput, 'Please enter your email');
    emailInput.focus();
    hasError = true;
  }

  if (!passwordInput.value.trim()) {
    shakeInput(passwordWrapper, 'Please enter your password');
    hasError = true;
  }


  if(hasError) return;

  //Ajax call or form submission logic here
  fetch('login.php', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      email: emailInput.value.trim(),
      password: passwordInput.value.trim()
    })
  })
  .then(response => response.json())
  .then(data => {
    if (data.status === 'success') {
      //Spinning loader or success message can be shown here before redirecting
      const btnSpinner = document.querySelector('.login-btn');
      btnSpinner.disabled = true; // prevent multiple clicks
      btnSpinner.innerHTML = `<span class="spinner"></span> Logging in...`;

      //small delay to show the spinner effect before redirecting
      setTimeout(() => {
     // Redirect to dashboard or home page
      window.location.href = 'home.php';
    }, 1000);
   } else if(data.status === "locked") {
     showModal(data.message);

  } else if (data.status === "error"){
    if(data.remaining !== undefined){
      showModal(data.message + "\n\nAttempts remaining: " + data.remaining);
    } else {
      showModal(data.message);
    }
  }

 })

  .catch(error => {
    console.error("Login error:",error);
  });

});



    function shakeInput(input, message = 'This field is required') {
  input.classList.remove('input-error'); // reset
  void input.offsetWidth; // force reflow
  input.classList.add('input-error');

  const wrapper = input.closest('.input-wrapper');
  if (!wrapper) return;
  const errorText = wrapper.querySelector('.error-text');
  if (errorText) errorText.textContent = message;
}

document.querySelectorAll('input').forEach(input => {
  input.addEventListener('input', () => {
    input.classList.remove('input-error');
    const wrapper = input.closest('.input-wrapper');

    const passwordWrapper = input.closest('.password-wrapper');
    if (passwordWrapper) {
      passwordWrapper.classList.remove('input-error');
    }

    const errorText = wrapper?.querySelector('.error-text');
    if (errorText) errorText.textContent = '';
  });
});


function clearErrorText(input){
  const wrapper = input.closest('.input-wrapper, .password-wrapper');
 const errorText = wrapper?.querySelector('.error-text');
    if (errorText) errorText.textContent = '';
}


    function togglePassword() {
      const passwordInput = document.getElementById('passwordInput');
      const toggleText = document.querySelector('.toggle');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleText.textContent = 'Hide';
      } else {
        passwordInput.type = 'password';
        toggleText.textContent = 'Show';
      }
    }


    function showModal(message){
      const modal = document.getElementById('message-alert');
      const modalMessage = document.getElementById('modal-message');
      modal.style.display = 'flex';
      modal.style.width = '80%';
      modal.style.height = '30px'; 
      modal.style.bottom = '20px'; 
       modalMessage.textContent = message;
       modalMessage.style.display = 'block'
       
       setTimeout(() => {
        modal.style.display = 'none';
          modal.style.width = '0%';
          modal.style.height = '0px'; 
          modal.style.bottom = '0px'; 
          modalMessage.textContent = '';
    }, 1000);

  }
  </script> 

	
</body>
</html>
