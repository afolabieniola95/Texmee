<body>

  <script>
   
   
    const form = document.querySelector('form');

form.addEventListener('submit', function(event) {
  const emailInput = document.getElementById('emailInput');
  const passwordInput = document.getElementById('passwordInput');
  const passwordWrapper = passwordInput.closest('.password-wrapper');

  let hasError = false;

  if (!emailInput.value.trim()) {
    shakeInput(emailInput, 'Please enter your email');
    emailInput.focus();
    hasError = true;
  }

  if (!passwordInput.value.trim()) {
    shakeInput(passwordWrapper, 'Please enter your password');
    hasError = true;
  }

  if (hasError) {
    event.preventDefault(); // 🔥 THIS STOPS SUBMISSION
  }
});



    function shakeInput(input, message = 'This field is required') {
  input.classList.remove('input-error'); // reset
  void input.offsetWidth; // force reflow
  input.classList.add('input-error');

  const wrapper = input.closest('.input-wrapper, .password-wrapper');
  if (!wrapper) return;
  const errorText = wrapper.querySelector('.error-text');
  if (errorText) errorText.textContent = message;
}

document.querySelectorAll('input, .password-wrapper').forEach(input => {
  input.addEventListener('input', () => {
    input.classList.remove('input-error');
    const wrapper = input.closest('.input-wrapper, .password-wrapper');
    const errorText = wrapper?.querySelector('.error-text');
    if (errorText) errorText.textContent = '';
  });
});


function clearErrorText(input){
  const wrapper = input.closest('.input-wrapper, .password-wrapper');
 const errorText = wrapper?.querySelector('.error-text');
    if (errorText) errorText.textContent = '';
}


    function togglePassword() {
      const passwordInput = document.getElementById('passwordInput');
      const toggleText = document.querySelector('.toggle');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleText.textContent = 'Hide';
      } else {
        passwordInput.type = 'password';
        toggleText.textContent = 'Show';
      }
    }
  </script>
