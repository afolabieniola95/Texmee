<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create Account - TexMee</title>
  <link rel="stylesheet" href="create-account.css">
</head>
<body>
  <div class="container">
  
    <form action="sign_up.php" method="POST" enctype="multipart/form-data" id="accountForm" autocomplete="on">

      <!-- Step 1 -->
      <div class="form-step active" id="step1">

        <div style="display: flex; align-items: center;  gap: 40px; text-align: center;">
      <img onclick="history.back()"  src="icon/backarrow.png" style="width: 20px; height: 20px;">
       <h3>What's your name?</h3>
</div>

        <label for="firstName">First Name</label>
        <div class="input-wrapper">
        <input type="text" id="firstName" name="first_name" autocomplete="given-name" autocapitalize="words" required>
         <span class="error-text"></span>
         </div>
         
        <label for="lastName">Last Name</label>
      <div class="input-wrapper">
        <input type="text" id="lastName" name="last_name" autocomplete="family-name" autocapitalize="words" required>
        <span class="error-text"></span>
        </div>
        
        <div class="btn-group">
        <button type="button" class="next-btn">Next</button>
        </div>
</div>

        <!-- Step 2-->
     <div class="form-step" id="step2">

         <div style="display: flex; align-items: center;  gap: 40px; text-align: center;">
      <img class="back-btn"  src="icon/backarrow.png" style="width: 20px; height: 20px;">
       <h3>What's your date of birth?</h3>
</div>

    
       <div class="input-wrapper">
        <label for="day">Day</label>
        <select id="day" name="day" disabled>
          <option value="">Select Days</option>
        </select>
        <span class="error-text"></span>
</div>

        <div class="input-wrapper">
          <label for="month">Month</label>
        <select id="month" name="month" disabled>
          <option value="">Select Months</option>
        </select>
        <span class="error-text"></span>
</div>

        <div class="input-wrapper">
          <label for="year">Year</label>
        <select id="year" name="year">
          <option value="">Select Years</option>
        </select>
        <span class="error-text"></span>

        <p id="age-display"></p>
</div>
      
             
        <div class="btn-group">
          <button type="button" class="next-btn">Next</button>
        </div>
</div>

     <!-- Step 3-->
     <div class="form-step" id="step3">

         <div style="display: flex; align-items: center;  gap: 40px; text-align: center;">
      <img class="back-btn"  src="icon/backarrow.png">
        <h3>What's your gender?</h3>
</div>

       <label for="gender">Gender</label>
       <div class="input-wrapper">
        <select id="gender" name="gender">
          <option value="">Select Gender</option>
          <option>Male</option>
          <option>Female</option>
          <option>Other</option>
        </select>
        <span class="error-text"></span>
        </div>
        
        <div class="btn-group">
          <button type="button" class="next-btn">Next</button>
        </div>
</div>

<!-- Step 4-->
     <div class="form-step" id="step4">

         <div style="display: flex; align-items: center;  gap: 40px; text-align: center;">
      <img class="back-btn"  src="icon/backarrow.png">
        <h3>What's your location?</h3>
</div>

       <label for="location">Location</label>
       <div class="input-wrapper">
        <input type="text" id="location" name="location" placeholder="Location">
        <span class="error-text"></span>
        </div>
        
        <div class="btn-group">
          <button type="button" class="next-btn">Next</button>
        </div>
</div>

      <!-- Step 5 -->
      <div class="form-step" id="step5">

  <div style="display: flex; align-items: center;  gap: 20px; text-align: center;">
      <img class="back-btn"  src="icon/backarrow.png">   
      <h3>What's your mobile number and email?</h3>
</div>

        <label for="email">Email</label>
        <div class="input-wrapper">
        <input type="email" id="email" name="email" autocomplete="new-email" autocapitalize="none" spellcheck="false" required>
         <span class="error-text"></span>
         </div>
         
        <label for="phone">Phone Number</label>
        <div class="input-wrapper">
        <input type="tel" id="phone" name="phone" required>
        <span class="error-text"></span>
        </div>
        
        <div class="btn-group">
          <button type="button" class="next-btn">Next</button>
        </div>
      </div>

      <!-- Step 6 -->
      <div class="form-step" id="step6">

    <div style="display: flex; align-items: center;  gap: 40px; text-align: center;">
      <img class="back-btn"  src="icon/backarrow.png">
      <h3>Create Password</h3>
</div>

        <label for="password">Password</label>
       <div class="input-wrapper">
        <input type="password" id="password" name="password" autocomplete="new-password" required>
         <span class="error-text"></span>
         </div>
         
     <div class="toggle" onclick="togglePassword()">Show</div>
      
       
        <div class="btn-group">
          <button type="button" class="next-btn">Next</button>
        </div>
    </div>

        <!-- Step 7 -->
      <div class="form-step" id="step7">

       <div style="display: flex; align-items: center;  gap: 40px; text-align: center;">
      <img class="back-btn"  src="icon/backarrow.png">
      <h3>Profile Photo</h3>
</div>

        <label for="profilePic">
         <div style="display: flex; align-items: center; justify-content: center;">
        <div id="profilePreview" class="preview"></div>
         <input type="file" id="profilePic" name="profile_pic" accept="image/*" style="display: none;">
         </div>
        </label>

        <div class="btn-group">
          <button type="submit" class="submit-btn">Create Account</button>
        </div>

      </div>
    </form>
  </div>

  <script src="create-account.js" defer></script>
</body>
</html>
