
<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>

  body {
      font-family: Arial, sans-serif;
			padding: 10px;
      align-items: center;
			justify-content: center;
}
        

 button {
    width: 150px;
    background-color: black;
    color: white;
    padding: 5px;
    box-shadow: 1px 2px 1px 1px black;
    border-radius: 5px;
    font-weight: bold;
    cursor: pointer;
    margin: 100px auto;
}

 .error {
 color: red;
 font-size: 12px;
 margin-bottom: 10px;
 display: block;
}     
		
	.toggle {
      position: absolute;
      right: 15px;
      top: 15px;
      cursor: pointer;
      font-size: 11px;
      color: grey;
      user-select: none;
	   text-align: right;
    }

    #container  {
    max-width: 1200px;
    margin: 0 auto;
    width: 100%;
    background-color: white;
    padding: 10px;
    box-sizing: border-box;
  }

  @keyframes shake {
    0% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    50% { transform: translateX(5px); }
    75% { transform: translateX(-5px); }
    100% { transform: translateX(0); }
  }
  
  .error-text {
   display: block;
   font-size: 12px;
   font-family: Arial,sans-serif,Trebuchet MS;
   color: #f10f;
   height: 16px;
   padding: 05px;
   margin-top: 2px;
 }
 

  .input-error {
  border: 2px double  red;
  box-shadow: 1px 1px 2px red;
  animation: shake 0.3s;
 }

  .spinner {
  border: 3px solid #f3f3f3; /* Light grey */
  border-top: 3px solid black; /* Black */
  border-radius: 50%;
  width: 14px;
  height: 14px;
  animation: spin 1s linear infinite;
  display: inline-block;
  vertical-align: middle;
  margin-right: 8px;
  }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  .modal{
    display: none;
    align-items: center;
    justify-content: center;
    position: fixed;
    bottom: 0;
    left: 50%;
    width: 0%;
    height: 0px;
    text-align: center;
    border: 1px solid grey;
    border-radius: 9px;
    box-shadow: 0 5px 5px grey, 0 0 5px grey;
    background-color: whitesmoke;
    font-size: 16px;
    font-family: Arial, Helvetica, sans-serif, segoe UI;
    transition: 0.5s ease;
    transform: translate(-50%, 0);
  }

  p{
    white-space: nowrap;
    font-size: 13px;
     font-family: Arial, Helvetica, sans-serif, segoe UI;
     text-align: center;
     margin-top: 60px;
  }

  .input-wrapper{
    position:   relative;
  }

  .input-wrapper input{
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%; 
    padding: 11px;
    font-size: 13px; 
    border-radius: 5px; 
    border: 1.5px solid gray;
    outline: none;
    box-sizing: border-box;
		background-color: white;
    margin-top: 20px;
}

.input-wrapper input:focus {
  border-color: black;

}

.input-wrapper label {
  position: absolute;
  top: 25%;
  left: 10px;
  transform: translateY(-25%);
  color: grey;
  font-size: 14px;
  transition: 0.25s ease all;
  padding: 0 5px;
  
}

.input-wrapper input:focus + label,
.input-wrapper input:not(:placeholder-shown) + label {
  top: 0;
  left:8px;  
  font-size: 15px;
  transform: translateY(-50%);
  color: black;
  background-color: white;
}


    </style>
</head>
<body>

    <div id="container">
    
    <div style = "padding: 10px; display: flex; align-items: center; justify-content: center;">
      <img src = "icon/texmee-logo.png" style = "width: 70px; height: 70px;">
      <div style = "padding: 15px 0px; font-size: 20px; color: black; font-weight: bold; text-align: left;">TexMee</div>

    </div>



     <form id="loginForm" autocomplete="off">

         <div class = "input-wrapper">
        <input type="email" name="email" id="emailInput"  placeholder = " " autocomplete="off"> 
        <label for="emailInput">Email</label>
          <span class="error-text"></span>
</div>
       
        <div class = "input-wrapper">
        <input type="password" name="password" id="passwordInput" placeholder = " " autocomplete="new-password">
         <label for="passwordInput">Password</label>
        <span class="error-text"></span> 


        <div class="toggle" onclick="togglePassword()">
         <img src="icon/password-open.png" id="toggle-show" style="width: 15px; height: 15px; display: none;">
         <img src="icon/password-close.png" id="toggle-hide" style="width: 15px; height: 15px; display: none;">
        </div>
        
  
        
</div>
       
     	
       <a href = "forgotten-password.html" style = "text-decoration: none; color: black;">
      <div style="text-align: left; font-size: 14px; width: 140px; border: 1px solid red;">Forgotten password?</div>
       </a> 

       <center>
            <button type="submit" class="login-btn">Login</button>
        </center>

       
  
    <p>Don't have an account yet?
      <span><a href="create_account.html" style="text-decoration: none; color: purple">Sign up</a></span>
      </p>
	

</form>
</div>

<div id="message-alert" class="modal">
  <p id="modal-message"></p>
</div>

  <script>
   
const form = document.getElementById('loginForm');

form.addEventListener('submit', function(event) {

event.preventDefault();

  const emailInput = document.getElementById('emailInput');
  const passwordInput = document.getElementById('passwordInput');
  

  let hasError = false;

  if (!emailInput.value.trim()) {
    shakeInput(emailInput, 'Please enter your email');
    emailInput.focus();
    hasError = true;
  }

  if (!passwordInput.value.trim()) {
    shakeInput(passwordInput, 'Please enter your password');
    hasError = true;
  }


  if(hasError) return;

  //Ajax call or form submission logic here
  fetch('login.php', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      email: emailInput.value.trim(),
      password: passwordInput.value.trim()
    })
  })
  .then(response => response.json())
  .then(data => {
    if (data.status === 'success') {
      //Spinning loader or success message can be shown here before redirecting
      const btnSpinner = document.querySelector('.login-btn');
      btnSpinner.disabled = true; // prevent multiple clicks
      btnSpinner.innerHTML = `<span class="spinner"></span> Logging in...`;

      //small delay to show the spinner effect before redirecting
      setTimeout(() => {
     // Redirect to dashboard or home page
      window.location.href = 'home.php';
    }, 1000);
   } else if(data.status === "locked") {
     showModal(data.message);

  } else if (data.status === "error"){
    if(data.remaining !== undefined){
      showModal(data.message + "\n\nAttempts remaining: " + data.remaining);
    } else {
      showModal(data.message);
    }
  }

 })

  .catch(error => {
    console.error("Login error:",error);
  });

});



    function shakeInput(input, message = 'This field is required') {
  input.classList.remove('input-error'); // reset
  void input.offsetWidth; // force reflow
  input.classList.add('input-error');

  const wrapper = input.closest('.input-wrapper');
  if (!wrapper) return;
  const errorText = wrapper.querySelector('.error-text');
  if (errorText) errorText.textContent = message;
}

document.querySelectorAll('input').forEach(input => {
  input.addEventListener('input', () => {
    input.classList.remove('input-error');
    const wrapper = input.closest('.input-wrapper');

    
    const errorText = wrapper?.querySelector('.error-text');
    if (errorText) errorText.textContent = '';
  });
});


function clearErrorText(input){
  const wrapper = input.closest('.input-wrapper');
 const errorText = wrapper?.querySelector('.error-text');
    if (errorText) errorText.textContent = '';
}


    function togglePassword() {
      const passwordInput = document.getElementById('passwordInput');
      const toggleShow = document.getElementById('toggle-show');
      const toggleHide= document.getElementById('toggle-hide');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleShow.style.display = 'none';
        toggleHide.style.display = 'block';
      } else {
        passwordInput.type = 'password';
        toggleShow.style.display = 'block';
        toggleHide.style.display = 'none';
      }
    }

const passwordInput = document.getElementById('passwordInput');

passwordInput.addEventListener('input', () => {
  const toggleShow = document.getElementById('toggle-show');
  const toggleHide= document.getElementById('toggle-hide');
  
  if (passwordInput.value.trim()) {
    toggleShow.style.display = 'block';
    toggleHide.style.display = 'none';
  } else {
    toggleShow.style.display = 'none';
    toggleHide.style.display = 'none';
  }
});

    function showModal(message){
      const modal = document.getElementById('message-alert');
      const modalMessage = document.getElementById('modal-message');
      modal.style.display = 'flex';
      modal.style.width = '80%';
      modal.style.height = '30px'; 
      modal.style.bottom = '20px'; 
       modalMessage.textContent = message;
       modalMessage.style.display = 'block'
       
       setTimeout(() => {
        modal.style.display = 'none';
          modal.style.width = '0%';
          modal.style.height = '0px'; 
          modal.style.bottom = '0px'; 
          modalMessage.textContent = '';
    }, 1000);

  }
  </script> 

	
</body>
</html>
