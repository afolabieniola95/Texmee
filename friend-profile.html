#post-section {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  padding: 3px;
  gap: 6px;
}

.posts{
  position: relative;
  aspect-ratio: 3/5;

  width: 100%;
}

.posts img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 9px;
}

img.view-icon{

left: 3px;
width: 30px;
height: 30px;

}

  left: 35px;
